name: 夸克网盘每日签到

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quark-signin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取北京时间日期
        id: date
        shell: bash
        run: echo "today=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: 恢复今日成功标记
        id: cache-success
        uses: actions/cache/restore@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}

      - name: 今日已完成签到
        if: steps.cache-success.outputs.cache-hit == 'true'
        run: echo "今日已全部签到成功，跳过重复执行。"

      - name: 检出代码
        if: steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/checkout@v7

      - name: 随机延迟
        if: steps.cache-success.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            max_delay=10
          else
            max_delay=60
          fi
          delay=$((RANDOM % (max_delay + 1)))
          echo "随机延迟 ${delay} 秒后开始执行。"
          sleep "$delay"

      - name: 设置 Python 环境
        if: steps.cache-success.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: steps.cache-success.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # ★ 关键修改：加 continue-on-error，让脚本返回非0时不直接阻断 job
      - name: 执行签到脚本
        id: sign
        if: steps.cache-success.outputs.cache-hit != 'true'
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
        run: python checkIn_Quark.py
        continue-on-error: true

      # ★★★ 方案二：输出签到日志到 Job Summary（GitHub Actions 页面右侧 Summary 标签页可见）★★★
      - name: 输出签到日志到 Job Summary
        if: always()
        shell: bash
        env:
          LOG: ${{ steps.sign.outputs.log }}
        run: |
          if [ -n "${LOG}" ]; then
            echo "${LOG}" >> $GITHUB_STEP_SUMMARY
          else
            echo "（无详细执行日志）" >> $GITHUB_STEP_SUMMARY
          fi

      # ★ 生成今日成功标记
      - name: 生成今日成功标记
        if: steps.sign.outcome == 'success'
        run: |
          mkdir -p .cache/quark-signin
          echo "${{ steps.date.outputs.today }}" > .cache/quark-signin/success

      - name: 保存今日成功标记
        if: steps.sign.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/quark-signin
          key: quark-signed-${{ steps.date.outputs.today }}

      # ★★★ 方案一：钉钉推送带上详细执行日志 ★★★
      - name: 推送签到结果到钉钉
        if: always()
        shell: bash
        env:
          LOG: ${{ steps.sign.outputs.log }}
        run: |
          if [ "${{ steps.cache-success.outputs.cache-hit }}" = "true" ]; then
            STATUS="✅ 今日已签到（缓存命中）"
          elif [ "${{ steps.sign.outcome }}" = "success" ]; then
            STATUS="✅ 全部签到成功"
          elif [ "${{ steps.sign.outcome }}" = "failure" ]; then
            STATUS="⚠️ 签到出错（部分账号失败或 Cookie 异常）"
          else
            STATUS="❓ 未执行"
          fi

          # 如果日志为空，给个默认提示
          if [ -z "${LOG}" ]; then
            LOG="（无详细执行日志）"
          fi

          # 用 jq 构造 JSON，安全处理换行和特殊字符，避免破坏 JSON 格式
          jq -n \
            --arg status "${STATUS}" \
            --arg log "${LOG}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              msgtype: "text",
              text: {
                content: "【夸克签到】\n\($status)\n\n\($log)\n\n🔗 \($url)"
              }
            }' > payload.json

          curl -s -X POST "https://oapi.dingtalk.com/robot/send?access_token=${{ secrets.DINGTALK_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @payload.json
